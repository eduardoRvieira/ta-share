spring.application.name=ta-share
# Configuração da Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ta_share?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do Hibernate/JPA (para atualizar ou criar tabelas se necessário, mas o Flyway gerencia isso)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuração do Flyway
spring.flyway.enabled=true