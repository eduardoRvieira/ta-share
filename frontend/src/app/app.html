<header>
  <div class="marca">
    <h1 class="sr-only">{{ title() }}</h1>
    <img src="/logo-tashare.png" alt="TA.share" class="logo-marca">
    <p>Sistema de Compartilhamento de Tecnologia Assistiva</p>
  </div>

  <section aria-label="Recursos de acessibilidade em áudio">
    <button type="button" (click)="lerPagina()">Ouvir conteúdo da tela</button>
    <button type="button" (click)="pararLeitura()">Parar leitura</button>
  </section>

  @if (estaLogado()) {
  <nav aria-label="Navegação principal">
    <ul>
      <li><a routerLink="/equipamentos" routerLinkActive="ativo">Equipamentos</a></li>
      <li><a routerLink="/categorias" routerLinkActive="ativo">Categorias</a></li>
      <li><a routerLink="/emprestimos" routerLinkActive="ativo">Empréstimos</a></li>
      <li><a routerLink="/usuarios" routerLinkActive="ativo">Usuários</a></li>
      <li><button type="button" (click)="sair()">Sair</button></li>
    </ul>
  </nav>
  }
</header>

<hr>

<main>
  <router-outlet />
</main>

<hr>

<footer>
  <div class="rodape-marca">
    <img src="/favicon-tashare.png" alt="" aria-hidden="true" class="icone-rodape">
    <p>TA.share — Projeto Integrador</p>
  </div>
</footer>
