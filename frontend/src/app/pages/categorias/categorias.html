<section aria-labelledby="titulo-categorias" class="p-6 sm:p-8 max-w-7xl w-full mx-auto space-y-6">

  <!-- Cabeçalho da Página + Botão + Nova categoria -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h2 id="titulo-categorias" class="text-2xl sm:text-3xl font-bold tracking-tight text-main">
        Categorias
      </h2>
      <p class="text-sm text-muted mt-1">
        Agrupe os equipamentos para facilitar a busca e os relatórios.
      </p>
    </div>

    <button type="button" (click)="abrirNova()"
      class="btn-primary inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold shadow-sm transition-colors cursor-pointer shrink-0">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span>Nova categoria</span>
    </button>
  </div>

  <!-- Alerta de Erro -->
  @if (erro()) {
    <div role="alert" class="p-3.5 rounded-lg bg-rose-500/15 border border-rose-500 text-rose-500 text-sm font-medium">
      {{ erro() }}
    </div>
  }

</section>
