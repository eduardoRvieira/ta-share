<app-modal
  [aberto]="aberto()"
  tituloId="titulo-form-emprestimo"
  [titulo]="emprestimoEmEdicao() ? 'Editar empréstimo' : 'Novo empréstimo'"
  subtitulo="Selecione quem vai receber e qual equipamento disponível será emprestado."
  (fechar)="fechar.emit()">

  <form #formEmprestimo="ngForm" (ngSubmit)="aoSubmeter()" class="space-y-4">
    <div>
      <label for="usuario-emprestimo" class="block text-xs font-bold text-main mb-1.5">
        Usuário <span class="text-rose-500">*</span>
      </label>
      <select id="usuario-emprestimo" name="usuarioId" [(ngModel)]="usuarioId" required
        class="input-app w-full rounded-lg px-3.5 py-2.5 text-sm transition-colors">
        <option value="" disabled>Selecione o usuário</option>
        @for (usuario of usuariosElegiveis(); track usuario.id) {
          <option [value]="usuario.id">{{ usuario.nome }}</option>
        }
      </select>
    </div>

    <div>
      <label for="equipamento-emprestimo" class="block text-xs font-bold text-main mb-1.5">
        Equipamento disponível <span class="text-rose-500">*</span>
      </label>
      <select id="equipamento-emprestimo" name="equipamentoId" [(ngModel)]="equipamentoId" required
        class="input-app w-full rounded-lg px-3.5 py-2.5 text-sm transition-colors">
        <option value="" disabled>Selecione o equipamento</option>
        @for (equipamento of equipamentosDisponiveis(); track equipamento.id) {
          <option [value]="equipamento.id">
            {{ equipamento.nome }} ({{ equipamento.patrimonio }})
          </option>
        }
      </select>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="data-emprestimo" class="block text-xs font-bold text-main mb-1.5">
          Data do empréstimo <span class="text-rose-500">*</span>
        </label>
        <input id="data-emprestimo" name="dataEmprestimo" type="date" [(ngModel)]="dataEmprestimo" required
          class="input-app w-full rounded-lg px-3.5 py-2.5 text-sm transition-colors">
      </div>

      <div>
        <label for="data-devolucao-prevista" class="block text-xs font-bold text-main mb-1.5">
          Devolução prevista <span class="text-rose-500">*</span>
        </label>
        <input id="data-devolucao-prevista" name="dataDevolucaoPrevista" type="date" [(ngModel)]="dataDevolucaoPrevista" required
          class="input-app w-full rounded-lg px-3.5 py-2.5 text-sm transition-colors">
      </div>
    </div>

    @if (emprestimoEmEdicao()) {
      <div>
        <label for="status-emprestimo" class="block text-xs font-bold text-main mb-1.5">
          Status <span class="text-rose-500">*</span>
        </label>
        <select id="status-emprestimo" name="status" [(ngModel)]="status" required
          class="input-app w-full rounded-lg px-3.5 py-2.5 text-sm transition-colors">
          <option value="ATIVO">Ativo</option>
          <option value="DEVOLVIDO">Concluído (Devolvido)</option>
          <option value="ATRASADO">Atrasado</option>
        </select>
      </div>
    }

    <div>
      <label for="observacoes-emprestimo" class="block text-xs font-bold text-main mb-1.5">
        Observações
      </label>
      <textarea id="observacoes-emprestimo" name="observacoes" [(ngModel)]="observacoes" rows="3"
        placeholder="Finalidade, acessórios entregues, orientações..."
        class="input-app w-full rounded-lg px-3.5 py-2.5 text-sm transition-colors"></textarea>
    </div>

    @if (!emprestimoEmEdicao()) {
      <div class="flex items-start gap-2.5 p-3.5 rounded-xl bg-blue-500/15 border border-blue-500/30 text-xs text-main">
        <svg class="w-4 h-4 text-blue-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8h.01M12 12v4" />
        </svg>
        <p class="leading-relaxed">
          Ao confirmar, o empréstimo fica ativo e o equipamento passa a constar como emprestado.
        </p>
      </div>
    }

    <app-form-actions
      [desabilitado]="!!formEmprestimo.invalid"
      [textoSalvar]="emprestimoEmEdicao() ? 'Salvar alterações' : 'Registrar empréstimo'"
      (cancelar)="fechar.emit()" />
  </form>

</app-modal>
