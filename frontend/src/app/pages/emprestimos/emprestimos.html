<section aria-labelledby="titulo-emprestimos">

  <!-- Cabeçalho da Página + Botão + Novo empréstimo -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h2 id="titulo-emprestimos" class="text-2xl sm:text-3xl font-bold tracking-tight text-main">
        Empréstimos
      </h2>
      <p class="text-sm text-muted mt-1">
        Acompanhe quem está com cada equipamento e registre devoluções.
      </p>
    </div>

    <button type="button" (click)="abrirNovo()"
      class="btn-primary inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold shadow-sm transition-colors cursor-pointer shrink-0">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span>Novo empréstimo</span>
    </button>
  </div>

  <!-- Barra de Filtros: Pills de situação + Busca -->
  <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4">
    
    <!-- Filtrar por situação -->
    <div>
      <span class="block text-xs font-bold text-main mb-2">
        Filtrar por situação
      </span>
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" (click)="filtroSituacao.set('TODOS')"
          [class]="filtroSituacao() === 'TODOS'
            ? 'btn-primary inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-bold transition-colors cursor-pointer'
            : 'inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg border border-app bg-surface text-xs font-semibold text-main hover:opacity-80 transition-opacity cursor-pointer'">
          @if (filtroSituacao() === 'TODOS') {
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          }
          <span>Todos ({{ contadores().todos }})</span>
        </button>

        <button type="button" (click)="filtroSituacao.set('ATIVO')"
          [class]="filtroSituacao() === 'ATIVO'
            ? 'btn-primary inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-bold transition-colors cursor-pointer'
            : 'inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg border border-app bg-surface text-xs font-semibold text-main hover:opacity-80 transition-opacity cursor-pointer'">
          @if (filtroSituacao() === 'ATIVO') {
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          }
          <span>Ativos ({{ contadores().ativos }})</span>
        </button>

        <button type="button" (click)="filtroSituacao.set('ATRASADO')"
          [class]="filtroSituacao() === 'ATRASADO'
            ? 'btn-primary inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-bold transition-colors cursor-pointer'
            : 'inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg border border-app bg-surface text-xs font-semibold text-main hover:opacity-80 transition-opacity cursor-pointer'">
          @if (filtroSituacao() === 'ATRASADO') {
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          }
          <span>Atrasados ({{ contadores().atrasados }})</span>
        </button>

        <button type="button" (click)="filtroSituacao.set('CONCLUIDO')"
          [class]="filtroSituacao() === 'CONCLUIDO'
            ? 'btn-primary inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-bold transition-colors cursor-pointer'
            : 'inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg border border-app bg-surface text-xs font-semibold text-main hover:opacity-80 transition-opacity cursor-pointer'">
          @if (filtroSituacao() === 'CONCLUIDO') {
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          }
          <span>Concluídos ({{ contadores().concluidos }})</span>
        </button>
      </div>
    </div>

    <!-- Buscar empréstimo -->
    <div class="w-full lg:w-72">
      <label for="busca-emprestimo" class="block text-xs font-bold text-main mb-2">
        Buscar empréstimo
      </label>
      <div class="relative">
        <svg class="w-4 h-4 text-muted absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
        </svg>
        <input id="busca-emprestimo" type="text"
          [ngModel]="filtroBusca()" (ngModelChange)="filtroBusca.set($event)"
          placeholder="Nome do usuário ou equipamento"
          class="input-app w-full rounded-lg pl-10 pr-3.5 py-2 text-sm transition-colors">
      </div>
    </div>

  </div>

  <!-- Contador de resultados -->
  <p class="text-xs text-muted">
    {{ emprestimosFiltrados().length }} empréstimo(s) encontrado(s)
  </p>

  <!-- Alerta de Erro -->
  @if (erro()) {
    <div role="alert" class="p-3.5 rounded-lg bg-rose-500/15 border border-rose-500 text-rose-500 text-sm font-medium">
      {{ erro() }}
    </div>
  }

</section>
