@if (aberto()) {
  <div (click)="fechar.emit()"
    class="fixed inset-0 z-50 bg-black/80 backdrop-blur-xs flex items-end sm:items-center justify-center sm:p-4 overflow-y-auto">
    <section (click)="$event.stopPropagation()" [attr.aria-labelledby]="tituloId()"
      [class]="(largura() === 'md' ? 'sm:max-w-md' : 'sm:max-w-lg') + ' bg-surface border-t sm:border border-app rounded-t-2xl sm:rounded-2xl w-full min-h-[92vh] sm:min-h-0 max-h-[95vh] overflow-y-auto p-5 sm:p-6 shadow-2xl flex flex-col justify-between space-y-5'">
      
      <div class="space-y-5">
        <!-- Cabeçalho do Modal (centralizado no mobile, alinhado à esquerda no desktop) -->
        <div class="relative flex items-start justify-center sm:justify-between gap-4 pt-1 sm:pt-0">
          <div class="text-center sm:text-left px-7 sm:px-0">
            <h3 [id]="tituloId()" class="text-lg font-bold text-main leading-tight">
              {{ titulo() }}
            </h3>
            @if (subtitulo() || mostrarAvisoObrigatorio()) {
              <p class="text-xs text-muted mt-1 leading-relaxed">
                @if (subtitulo()) {
                  <span>{{ subtitulo() }} </span>
                }
                @if (mostrarAvisoObrigatorio()) {
                  <span>Campos marcados com <span class="text-rose-500 font-bold">*</span> são obrigatórios.</span>
                }
              </p>
            }
          </div>

          <button type="button" (click)="fechar.emit()" aria-label="Fechar janela"
            class="absolute right-0 top-0 sm:static p-1.5 rounded-lg text-muted hover:text-main transition-colors cursor-pointer shrink-0">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Conteúdo projetado (formulário da página) -->
        <ng-content />
      </div>

    </section>
  </div>
}
