<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
  <div>
    <h2 [id]="tituloId()" class="text-2xl sm:text-3xl font-bold tracking-tight text-main">
      {{ titulo() }}
    </h2>
    <p class="text-sm text-muted mt-1">
      {{ subtitulo() }}
    </p>
  </div>

  @if (mostrarBotao() && textoBotao()) {
    <button type="button" (click)="acaoPrimaria.emit()"
      class="btn-primary self-start sm:self-auto relative z-10 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold shadow-sm transition-colors cursor-pointer shrink-0">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span>{{ textoBotao() }}</span>
    </button>
  }
</div>
