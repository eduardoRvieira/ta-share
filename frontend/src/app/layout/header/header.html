<header class="bg-surface border-b border-app px-3 sm:px-6 h-16 flex items-center justify-between gap-2 sm:gap-3 sticky top-0 z-30">
  
  <!-- Esquerda: Botão Menu (se logado) + Logo + Subtítulo -->
  <div class="flex items-center gap-2 sm:gap-3.5 min-w-0">
    @if (auth.estaLogado()) {
      <button type="button" (click)="layout.alternarMenu()"
        [attr.aria-expanded]="layout.menuAberto()"
        aria-label="Alternar menu lateral"
        class="p-2 rounded-lg text-muted hover:text-main hover:opacity-80 transition-colors cursor-pointer shrink-0">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <line x1="9" y1="4" x2="9" y2="20" />
        </svg>
      </button>
    }

    <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
      <h1 class="sr-only">{{ layout.titulo() }}</h1>
      <img src="/logo-tashare.png" alt="TA.share" class="logo-img h-8 sm:h-11 w-auto object-contain shrink-0">
      <span class="text-muted hidden md:inline">·</span>
      <span class="text-muted hidden md:inline truncate text-sm">
        {{ auth.estaLogado() ? 'Gestão de empréstimos' : 'Sistema de Compartilhamento de Tecnologia Assistiva' }}
      </span>
    </div>
  </div>

  <!-- Direita: Leitura de Tela + Alto Contraste + Tema + Usuário -->
  <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
    
    <section aria-label="Recursos de acessibilidade em áudio" class="hidden lg:flex items-center gap-1.5">
      <button type="button" (click)="layout.lerPagina()"
        class="px-2.5 py-1.5 rounded-lg border border-app bg-app text-xs font-medium text-main hover:opacity-80 transition-opacity cursor-pointer">
        Ouvir conteúdo da tela
      </button>
      <button type="button" (click)="layout.pararLeitura()"
        class="px-2.5 py-1.5 rounded-lg border border-app bg-app text-xs font-medium text-muted hover:text-main transition-colors cursor-pointer">
        Parar leitura
      </button>
    </section>

    <button type="button" (click)="tema.alternarAltoContraste()"
      [attr.aria-pressed]="tema.altoContraste()"
      aria-label="Alternar alto contraste"
      class="btn-hc inline-flex items-center gap-2 px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors cursor-pointer">
      <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 3a9 9 0 0 0 0 18V3z" fill="currentColor" />
      </svg>
      <span class="hidden sm:inline">Alto contraste</span>
    </button>

    <button type="button" (click)="tema.alternarTema()"
      [attr.aria-label]="tema.temaEscuro() ? 'Mudar para tema claro' : 'Mudar para tema escuro'"
      class="p-2 rounded-lg border border-app bg-app text-main hover:opacity-80 transition-opacity cursor-pointer">
      @if (tema.temaEscuro()) {
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      } @else {
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      }
    </button>

    @if (auth.usuario(); as user) {
      <div class="flex items-center gap-2.5 p-1 sm:pl-1.5 sm:pr-3.5 sm:py-1 rounded-full border border-app bg-app/60">
        <div class="btn-primary w-8 h-8 rounded-full font-bold text-xs flex items-center justify-center shrink-0">
          {{ iniciaisUsuario() }}
        </div>
        <div class="hidden sm:block leading-tight">
          <p class="text-xs font-semibold text-main">{{ user.nome }}</p>
          <p class="text-[11px] text-muted">{{ perfilFormatado() }}</p>
        </div>
      </div>
    }
  </div>
</header>
